<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</head>
<body>
    <div class="d-flex bg-dark justify-content-between p-2 align-items-center shadow-sm navbar-extended">
        <div>
            <h1 class="text-dark text-white p-2">NATURE</h1>
        </div>
        <div class="d-flex gap-3 mx-5">
            <a href="#home" class="nav-link text-white">Home</a>
            <a href="#nature" class="nav-link text-white">Nature</a>
            <a href="#cards" class="nav-link text-white">Cards</a>
        </div>
         </div>


   
    

   <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/image/n1.png" class="d-block w-100" alt="Nature">
    </div>
    <div class="carousel-item">
      <img src="assets/image/n2.png" class="d-block w-100" alt="Nature">
    </div>
    <div class="carousel-item">
      <img src="assets/image/n3.png" class="d-block w-100" alt="Nature">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
<section class="mt-2">
    <div id="nature">
    <div class="container">
        <div>
            <h4 class="bg-warning text-center mb-4">Nature</h4>
            <p class="bg-secondary">Nature is the physical world and everything in it that is not made by people. It includes plants, animals, forests, oceans, weather, and the Earth itself. Nature gives us the air we breathe, the water we drink, and the food we eat to stay alive.</p>
        </div>
    </div>
    <div id="cards">
    <div class="row bg-light mb-4">
        <div class="col-3">
            <img src="assets/image/1.png" class="w-100 rounded shadow-lg p-2" alt="Nature">
        </div>
        <div class="col-3">
            <img src="assets/image/2.png" class="w-100 rounded shadow-lg p-2" alt="Nature">
        </div>
       
         <div class="col-3">
            <img src="assets/image/3.png" class="w-100 rounded shadow-lg p-2" alt="Nature">
        </div>
        <div class="col-3">
            <img src="assets/image/4.png" class="w-100 rounded shadow-lg p-2" alt="Nature">
        </div>
        <div class="text-center mt-4">
            <button class="btn btn-primary">View More</button>
        </div>
        </div>
        </div>
        

    </div>
    

</section>




    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    
    
</body>
</html>
