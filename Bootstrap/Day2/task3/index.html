<!DOCTYPE html>
<html lang="en">
<head>

    <title>Four Columns</title>

</head>
<body>

    <div class="container mt-4">
        <div class="row">

            <div class="col-3 p-4 bg-primary text-white">

                Box 2

                Box 4

        </div>
    </div>

</html>
