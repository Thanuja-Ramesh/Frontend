<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <section>
       <div>
        <form>
            <label for="username">Enter the Name</label>
            <input type="text" id="username"><br />
            <label for="useremail">Enter the Email</label>
            <input type="text" id="useremail"><br />
            <label for="userpassword">Enter the Password</label>
            <input type="text" id="userpassword"><br />
            <label for="usermobile">Enter the Mobile Number</label>
            <input type="tel" id="usermobile" minlength="10" maxlength="20"><br />
            <label for="usergender">Gender</label>
            <input type="radio" name="gender" id="usergender">Male
            <input type="radio" name="gender" id="usergender">Female<br />
            <label for="userskills">Skills</label>
            <input type="checkbox" name="skills" id="userskills">HTML
            <input type="checkbox" name="skills" id="userskills">CSS
            <input type="checkbox" name="skills" id="userskills">JS
            <label for="usercourse"></label>
            <select id="usercourse">
            <option value=""selected disabled>select one</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
      </select>
      <input type="submit" value="Register">



        </form>
       </div>
    </section>
    
</body>
</html>
