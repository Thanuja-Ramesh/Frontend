<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <main>
        <div>
            <h2>Media Showcase</h2>
            <h4>Image</h4>
            <img src="asserts/image/images (1).jpg" alt="Image" width="400" height="300">
            <img src="asserts/image/images.jpg" alt="Image" width="400" height="300">
            <img src="asserts/image/images2.jpg" alt="Image" width="400" height="300">
        </div>
        <section>
            <h4>Audio Player</h4>
            <div>
            <audio controls autoplay loop muted>
            <source src="asserts/audio/audio1.mpeg" type="audio/mpeg">
           </audio>
        </div>
    </section>
    <section>
        <div>
            <h4>Video Player</h4>
            <video controls muted loop width="300" height="300" poster="asserts/image/download.jpg">
            <source src="asserts/video/video.mp4" type="video/mp4">
            </video>
        </div>
    </section>
    <section>
        <div>
            <h4>Youtube video and Google Map</h4>
           <iframe width="560" height="315" src="https://www.youtube.com/embed/o0LydWpBQts?si=XDLcj2joZ5rCag_n" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen width="500" height="500"></iframe>
           <p>
           <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31107.364831771607!2d78.8512774455081!3d12.944916116906997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bad6d361be288b5%3A0x88f9feef00e8cd73!2sGudiyatham%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1784818958275!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" width="100" height="100"></iframe>
           </p>
        </div>
    </section>
    </main>
    <footer>
        <div>
            <h2>Embedded PDF</h2>
            <iframe src="asserts/PDF/image.pdf" frameborder="3" width="500" height="500"></iframe>
        </div>
    </footer>
</body>
</html>
