<!DOCTYPE html>
<html>
<head>
    <title>Smooth Card Toggle</title>

    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid black;
            text-align: center;
        }

        img {
            width: 100%;
        }

        .details {
            display: none;
        }

        .show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">

        <img src="assets/Image/t3.jpg" alt="Image">

        <h2>Nature</h2>

        <p id="details" class="details">
            Nature is beautiful and gives us fresh air.
        </p>

        <button id="btn">Show Details</button>

    </div>

    <script src="assets/js/index.js"></script>

</body>
</html>
