<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    

    <h1>Our Products</h1>

    <div class="product-grid">
        <div class="product">
            <img src="assets/image/bluetooth.jpg" alt="Speaker" width="200" height="200">
            <h2>Bluetooth Speaker</h2>
            <p>₹3,000</p>
            <button>Buy Button</button>
        </div>
        <div class="card">
            <img src="assets/image/camera.jpg" alt="Camera" width="200" height="200">
            <h2>Camera</h2>
            <p>₹35,000</p>
            <button>Buy Button</button>
        </div>

        <div class="card1">
            <img src="assets/image/laplop.jpg" alt="Laptop" width="200" height="200">
            <h2>Laptop</h2>
            <p>₹50,000</p>
            <button>Buy Button</button>
        </div>
        <div class="card2">
            <img src="assets/image/mobile.jpg" alt="Mobile" width="200" height="200">
            <h2>Mobile</h2>
            <p>₹50,000</p>
            <button>Buy Button</button>
        </div>
    </div>

</body>
</html>
