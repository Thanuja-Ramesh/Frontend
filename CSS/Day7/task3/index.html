<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    

    <h1>Our Products</h1>

    <div class="product-grid">

        <div class="product-card">
            <img src="assets/image/laplop.jpg" alt="Laptop" width="200" height="200">
            <h2>Laptop</h2>
            <p>₹50,000</p>
        </div>

        
        

        <div class="product-card">
            <img src="assets/image/headphone.jpg" alt="Headphones" width="200" height="200">
            <h2>Headphones</h2>
            <p>₹2,000</p>
        </div>

        <div class="product-card">
            <img src="assets/image/watch.jpg" alt="Smart Watch" width="200" height="200">
            <h2>Smart Watch</h2>
            <p>₹4,500</p>
        </div>

        <div class="product-card">
            <img src="assets/image/keyboard.jpg" alt="Keyboard" width="200" height="200">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <div class="product-card">
            <img src="assets/image/mouse.jpg" alt="Mouse" width="200" height="200">
            <h2>Wireless Mouse</h2>
            <p>₹800</p>
        </div>

        <div class="product-card">
            <img src="assets/image/camera.jpg" alt="Camera" width="200" height="200">
            <h2>Camera</h2>
            <p>₹35,000</p>
        </div>

        <div class="product-card">
            <img src="assets/image/bluetooth.jpg" alt="Speaker" width="200" height="200">
            <h2>Bluetooth Speaker</h2>
            <p>₹3,000</p>
        </div>

    </div>

</body>
</html>
